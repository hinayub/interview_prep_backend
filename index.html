<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Cortex scores your resume against a job description, runs a mock interview tailored to the role, and tells you exactly where to improve."
    />
    <meta name="theme-color" content="#151019" />
    <title>Cortex — practise the interview before it happens</title>
    <!-- The Cortex mark, inline: one fewer request and it cannot 404. Sodium, so
         the tab reads as the same lit room the page is. -->

    />

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Bricolage Grotesque for display (it carries the width axis the hero
         narrows), Instrument Sans for reading, DM Mono for annotation. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,400..800&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=DM+Mono:wght@300;400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <!-- Inline, not a utility class: this has to hold before the stylesheet lands,
       or the first paint of a dark app is a white flash. -->
  <body class="h-full" style="background-color: #151019">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
